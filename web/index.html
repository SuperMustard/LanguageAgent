<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语言口语演练</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --border: #e2ded6;
    --text: #2a2723;
    --muted: #86807a;
    --accent: #b5553a;
    --accent-dark: #8f4230;
    --user-bubble: #e8e2d8;
    --ai-bubble: #f1e8dd;
    --error: #b3392c;
    --error-bg: #fbe9e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  select, button {
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    cursor: pointer;
    max-width: 100%;
  }
  select {
    flex: 1 1 220px;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: var(--accent-dark); }
  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  button.recording {
    background: var(--error);
    border-color: var(--error);
    color: #fff;
  }
  #chat {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 120px;
  }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .bubble.ai {
    background: var(--ai-bubble);
    align-self: flex-start;
    border-bottom-left-radius: 2px;
  }
  .bubble.user {
    background: var(--user-bubble);
    align-self: flex-end;
    border-bottom-right-radius: 2px;
  }
  .bubble .label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  #status {
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
  }
  #error {
    display: none;
    background: var(--error-bg);
    color: var(--error);
    border: 1px solid var(--error);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    font-size: 13px;
    overflow-wrap: break-word;
  }
  .card .zh { font-weight: 600; margin-bottom: 6px; }
  .card .wrong { color: var(--error); text-decoration: line-through; }
  .card .correct { color: #2f7a4f; font-weight: 600; }
  .card .note { color: var(--muted); margin-top: 6px; }
  .card .pattern {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    background: var(--ai-bubble);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .word-item {
    display: inline-block;
    background: var(--ai-bubble);
    border-radius: 999px;
    padding: 4px 10px;
    margin: 3px 4px 3px 0;
    font-size: 13px;
  }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .export-block {
    margin-top: 12px;
  }
  .export-block label {
    font-size: 12px;
  }
  textarea {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    min-height: 110px;
    margin-top: 6px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    resize: vertical;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>语言口语演练</h1>
  <div class="sub">角色扮演不纠错；结束后单独诊断。演练中的语音不会被打断。</div>

  <div id="error"></div>

  <div class="panel">
    <div class="row">
      <select id="scenario-select"></select>
      <button id="start-btn" class="primary">开始演练</button>
      <button id="mic-btn" disabled>🎤 麦克风开启（点击静音）</button>
      <button id="end-btn" disabled>结束演练</button>
      <button id="exit-btn">退出</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="panel">
    <div id="chat"></div>
  </div>

  <div id="debrief-panel" class="panel" style="display:none">
    <h2>Debrief 诊断</h2>
    <div id="debrief-sentences"></div>
    <div id="debrief-words"></div>
  </div>

  <div class="panel">
    <h2>导出到 langhelper</h2>
    <div class="sub">导出这门语言目前存库的全部病句/生词，粘进 Anki 的 langhelper 导入对话框。</div>
    <div class="row">
      <button id="export-fr-btn">导出法语 (fr)</button>
      <button id="export-en-btn">导出英语 (en)</button>
    </div>
    <div id="export-result" style="display:none">
      <div class="export-block">
        <div class="row" style="justify-content:space-between">
          <label class="sub">病句 JSON（fr_sentences.json / en_sentences.json）</label>
          <button id="copy-sentences-btn" type="button">复制</button>
        </div>
        <textarea id="export-sentences" readonly></textarea>
      </div>
      <div class="export-block">
        <div class="row" style="justify-content:space-between">
          <label class="sub">生词 txt（fr_words.txt / en_words.txt）</label>
          <button id="copy-words-btn" type="button">复制</button>
        </div>
        <textarea id="export-words" readonly></textarea>
      </div>
      <div id="export-file-paths" class="sub"></div>
    </div>
  </div>
</div>

<script type="module" src="/pipecat/voice-client.js"></script>
<script>
const state = {
  voice: null,
};

const el = {
  scenarioSelect: document.getElementById('scenario-select'),
  startBtn: document.getElementById('start-btn'),
  micBtn: document.getElementById('mic-btn'),
  endBtn: document.getElementById('end-btn'),
  exitBtn: document.getElementById('exit-btn'),
  status: document.getElementById('status'),
  chat: document.getElementById('chat'),
  error: document.getElementById('error'),
  debriefPanel: document.getElementById('debrief-panel'),
  debriefSentences: document.getElementById('debrief-sentences'),
  debriefWords: document.getElementById('debrief-words'),
  exportFrBtn: document.getElementById('export-fr-btn'),
  exportEnBtn: document.getElementById('export-en-btn'),
  exportResult: document.getElementById('export-result'),
  exportSentences: document.getElementById('export-sentences'),
  exportWords: document.getElementById('export-words'),
  exportFilePaths: document.getElementById('export-file-paths'),
  copySentencesBtn: document.getElementById('copy-sentences-btn'),
  copyWordsBtn: document.getElementById('copy-words-btn'),
};

function showError(msg) {
  el.error.textContent = msg;
  el.error.style.display = 'block';
}

function clearError() {
  el.error.style.display = 'none';
}

function setStatus(msg) {
  el.status.textContent = msg;
}

function addBubble(role, text) {
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + role;
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = role === 'ai' ? 'AI' : '你';
  bubble.appendChild(label);
  bubble.appendChild(document.createTextNode(text));
  el.chat.appendChild(bubble);
  el.chat.scrollTop = el.chat.scrollHeight;
}

async function loadScenarios() {
  const res = await fetch('/scenarios');
  const data = await res.json();
  el.scenarioSelect.innerHTML = '';
  for (const [key, desc] of Object.entries(data)) {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = `${key} — ${desc}`;
    el.scenarioSelect.appendChild(opt);
  }
}

function voiceCallbacks() {
  return {
    onConnected: () => {
      setStatus('已连接，等 AI 开口……');
    },
    onDisconnected: () => {
      el.micBtn.disabled = true;
      el.endBtn.disabled = true;
      el.startBtn.disabled = false;
    },
    onBotReady: () => {
      setStatus('演练中——直接说话就行，AI 会自动接话，也可以随时插话打断它。');
    },
    onUserTranscript: (text) => {
      addBubble('user', text);
      el.endBtn.disabled = false;
    },
    onBotTranscript: (text) => {
      addBubble('ai', text);
    },
    onError: (msg) => {
      showError('语音连接出错：' + msg);
    },
  };
}

async function startSession() {
  clearError();
  el.startBtn.disabled = true;
  setStatus('连接中…（浏览器可能会弹出麦克风权限请求，点允许）');
  try {
    const { VoiceSession } = window.LangPracticeVoice;
    state.voice = new VoiceSession(voiceCallbacks());
    el.chat.innerHTML = '';
    el.debriefPanel.style.display = 'none';
    await state.voice.connect(el.scenarioSelect.value);
    el.micBtn.disabled = false;
    el.micBtn.textContent = '🎤 麦克风开启（点击静音）';
  } catch (e) {
    showError('开始演练失败：' + e.message);
    setStatus('');
    el.startBtn.disabled = false;
  }
}

function toggleMic() {
  const client = state.voice?.client;
  if (!client) return;
  const enabled = !client.isMicEnabled;
  client.enableMic(enabled);
  el.micBtn.textContent = enabled ? '🎤 麦克风开启（点击静音）' : '🔇 已静音（点击开启）';
}

function renderDebrief(data) {
  el.debriefSentences.innerHTML = '';
  el.debriefWords.innerHTML = '';

  if (data.sentences.length === 0) {
    el.debriefSentences.innerHTML = '<div class="sub">这一场没有明显病句，很不错。</div>';
  }
  for (const s of data.sentences) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="zh">${s.zh}</div>
      <div class="wrong">${s.en_wrong}</div>
      <div class="correct">${s.en_correct}</div>
      <div class="note">${s.error_note}</div>
      <span class="pattern">${s.pattern}</span>
    `;
    el.debriefSentences.appendChild(card);
  }

  if (data.words.length > 0) {
    const title = document.createElement('div');
    title.className = 'sub';
    title.textContent = '生词：';
    el.debriefWords.appendChild(title);
    for (const w of data.words) {
      const chip = document.createElement('span');
      chip.className = 'word-item';
      chip.textContent = w.meaning ? `${w.word}｜${w.meaning}` : w.word;
      el.debriefWords.appendChild(chip);
    }
  }
}

async function endSession() {
  clearError();
  if (!state.voice) return;
  el.endBtn.disabled = true;
  el.micBtn.disabled = true;
  setStatus('生成 Debrief 诊断中…');
  try {
    const data = await state.voice.endSession();
    renderDebrief(data);
    el.debriefPanel.style.display = 'block';
    setStatus('演练已结束，数据已存库。想导出给 langhelper 用，见下面的"导出到 langhelper"。');
  } catch (e) {
    showError('结束演练失败：' + e.message);
    setStatus('');
  } finally {
    await state.voice.disconnect();
    state.voice = null;
    el.startBtn.disabled = false;
  }
}

async function exportLanguage(language) {
  clearError();
  setStatus(`导出 ${language} 中…`);
  try {
    const res = await fetch(`/export/${language}`);
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const data = await res.json();
    el.exportSentences.value = data.sentences_json;
    el.exportWords.value = data.words_txt;
    el.exportFilePaths.textContent = `同时已写入磁盘：${data.sentences_file} ／ ${data.words_file}`;
    el.exportResult.style.display = 'block';
    setStatus(`已导出 ${language}，可以复制粘进 langhelper 了。`);
  } catch (e) {
    showError('导出失败：' + e.message);
    setStatus('');
  }
}

async function copyTextarea(textarea, button) {
  try {
    await navigator.clipboard.writeText(textarea.value);
  } catch (e) {
    textarea.select();
    document.execCommand('copy');
  }
  const original = button.textContent;
  button.textContent = '已复制';
  setTimeout(() => { button.textContent = original; }, 1500);
}

async function exitApp() {
  clearError();
  if (state.voice && !confirm('演练还没结束，退出会丢失这一场还没保存的记录，确定要退出吗？')) {
    return;
  }
  el.startBtn.disabled = true;
  el.micBtn.disabled = true;
  el.endBtn.disabled = true;
  el.exitBtn.disabled = true;
  setStatus('正在关闭服务…');
  if (state.voice) {
    await state.voice.disconnect().catch(() => {});
    state.voice = null;
  }
  try {
    await fetch('/shutdown', { method: 'POST' });
  } catch (e) {
    // 关闭过程中连接断开是预期行为，忽略
  }
  setStatus('页面服务已关闭，可以关闭这个标签页了。语音 bot 那个命令行窗口（端口 7860）还得你自己关一下。');
  window.close(); // 浏览器可能拦截非脚本打开的标签页，拦截时上面那句提示就是后备方案
}

el.startBtn.addEventListener('click', startSession);
el.micBtn.addEventListener('click', toggleMic);
el.endBtn.addEventListener('click', endSession);
el.exitBtn.addEventListener('click', exitApp);
el.exportFrBtn.addEventListener('click', () => exportLanguage('fr'));
el.exportEnBtn.addEventListener('click', () => exportLanguage('en'));
el.copySentencesBtn.addEventListener('click', () => copyTextarea(el.exportSentences, el.copySentencesBtn));
el.copyWordsBtn.addEventListener('click', () => copyTextarea(el.exportWords, el.copyWordsBtn));

loadScenarios().catch((e) => showError('加载场景失败：' + e.message));
</script>
</body>
</html>
